{% load static %}

<!DOCTYPE html>
<html data-bs-theme="dark">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <head>
    <title>{% block title %} {% endblock %}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary ">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">KNOW</a>
        <button
          class="navbar-toggler  "
         
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse  " id="navbarNav">
         

          {% if user.is_authenticated %}
 <ul class="navbar-nav">
            <li class="nav-item">
              <a href="{% url 'Tweet_list' %}" class="nav-link active ms-2" aria-current="page" href="#">Feed</a>
            </li>
            <li class="nav-item">
              <a class="nav-link ms-2" href="#">Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled ms-2"  aria-disabled="true">Search</a> 
            </li> 
            <li class="nav-item">
              <a class="nav-link disabled ms-2"  aria-disabled="true">Help</a> 
            </li> 
          </ul>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-danger me-2" type="submit">Logout</button>
          </form>
 
          {% else %}

          <a href="{% url 'register' %}" class="btn bt-primary mx-2" >Register</a>
          <a href="{% url 'login' %}" class="btn bt-successful mx-2" >Login</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <div class="container">{% block content %} {% endblock %}</div>
  </body>
</html>
